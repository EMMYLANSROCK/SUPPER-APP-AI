function smartAI(){
let v=document.getElementById("word").value.toLowerCase().trim();
if(verbs[v]){
let d=verbs[v];

`Present:${d.present}<br>Past:${d.past}<br>Future:${d.future}<br>Continuous:${d.continuous}<br>Kinyarwanda:${d.rw}`;

}

function speak(){
speechSynthesis.speak(new SpeechSynthesisUtterance(document.getElementById("res").innerText));

/* MATH */
let expr="";
function addSymbol(v){expr+=v;document.getElementById("expr").value=expr;}
function clearExpr(){expr="";document.getElementById("expr").value="";}
function calculate(){document.getElementById("r1").innerText=eval(expr);expr="";}

function getAllTrig(){
let a=parseFloat(document.getElementById("ang").value);
let r=a*Math.PI/180;
document.getElementById("r2").innerHTML=
"sin:"+Math.sin(r)+"<br>cos:"+Math.cos(r)+"<br>tan:"+Math.tan(r);
}

function shape(t){
if(t=="rect"){
let l=prompt("Length:");
let w=prompt("Width:");
document.getElementById("r3").innerHTML="Area:"+l*w;
}
if(t=="square"){
let s=prompt("Side:");
document.getElementById("r3").innerHTML="Area:"+s*s;
}
if(t=="circle"){
let r=prompt("Radius:");
document.getElementById("r3").innerHTML="Area:"+(Math.PI*r*r).toFixed(2);
}
if(t=="triangle"){
let a=prompt("A:");
let b=prompt("B:");
let c=prompt("C:");
document.getElementById("r3").innerHTML="Perimeter:"+(+a + +b + +c);
}
if(t=="tube"){
let r=prompt("Radius:");
let h=prompt("Height:");
document.getElementById("r3").innerHTML="Volume:"+(Math.PI*r*r*h).toFixed(2);
}
}
